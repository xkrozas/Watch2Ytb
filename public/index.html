<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WatchParty - Anti-Fallos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f0f0f; color: #fff; padding: 15px; }

    header { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto 15px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.3rem; color: #ff0000; display: flex; align-items: center; gap: 8px; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 12px; padding: 6px 10px; border-radius: 20px; font-weight: 600; background: #222; }
    .status-connected { color: #4caf50; border: 1px solid #2e7d32; }
    .status-reconnecting { color: #ffeb3b; border: 1px solid #fbc02d; }
    .status-disconnected { color: #f44336; border: 1px solid #d32f2f; }

    button { background: #ff0000; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
    button:hover { background: #cc0000; }
    .btn-secondary { background: #272727; color: #fff; }
    .btn-secondary:hover { background: #3f3f3f; }

    .main-layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

    .player-section { display: flex; flex-direction: column; gap: 10px; }
    .player-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
    #player { width: 100%; height: 100%; }

    .sidebar { background: #1a1a1a; border-radius: 10px; display: flex; flex-direction: column; height: calc(100vh - 90px); min-height: 500px; }
    .tabs { display: flex; border-bottom: 1px solid #2a2a2a; }
    .tab-btn { flex: 1; background: transparent; border-radius: 0; padding: 12px; border-bottom: 2px solid transparent; color: #aaa; }
    .tab-btn.active { color: #fff; border-bottom: 2px solid #ff0000; font-weight: bold; }

    .tab-content { display: none; flex-direction: column; flex: 1; overflow: hidden; padding: 12px; }
    .tab-content.active { display: flex; }

    .search-bar { display: flex; gap: 6px; margin-bottom: 12px; }
    .search-bar input { flex: 1; padding: 9px 12px; border-radius: 6px; border: 1px solid #333; background: #0f0f0f; color: white; font-size: 13px; }
    .item-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    .video-card { display: flex; gap: 10px; background: #222; border-radius: 6px; padding: 8px; align-items: center; }
    .video-card img { width: 90px; height: 50px; object-fit: cover; border-radius: 4px; }
    .video-info { flex: 1; min-width: 0; }
    .video-info .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video-info .channel { font-size: 11px; color: #aaa; }
    .card-actions { display: flex; flex-direction: column; gap: 4px; }
    .card-actions button { padding: 4px 8px; font-size: 11px; }

    .empty-state { text-align: center; color: #777; margin-top: 40px; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 WatchParty</h1>
    <div class="header-actions">
      <span id="status-badge" class="status-badge status-connected">🟢 Conectando...</span>
      <button id="sync-btn" class="btn-secondary" title="Fuerza la sincronización si notas desfase">🔄 Sincronizar</button>
      <button id="copy-btn">📋 Copiar enlace</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="player-section">
      <div class="player-wrapper">
        <div id="player"></div>
      </div>
      <p style="font-size: 12px; color: #888; text-align: center;">
        💡 <i>Para ver sin anuncios, usad <b>uBlock Origin</b> o el navegador <b>Brave</b>.</i>
      </p>
    </div>

    <div class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('search')">🔍 Buscar</button>
        <button class="tab-btn" onclick="switchTab('queue')">📑 Cola (<span id="queue-count">0</span>)</button>
      </div>

      <div id="tab-search" class="tab-content active">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Buscar canciones o pegar enlace...">
          <button id="search-btn">Buscar</button>
        </div>
        <div class="item-list" id="search-results">
          <div class="empty-state">Busca un vídeo para reproducirlo o añadirlo a la cola.</div>
        </div>
      </div>

      <div id="tab-queue" class="tab-content">
        <div class="item-list" id="queue-list">
          <div class="empty-state">La cola está vacía.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId) {
      roomId = Math.random().toString(36).substring(2, 9);
      window.location.search = `?room=${roomId}`;
    }

    const socket = io();
    let player;
    let isRemoteAction = false;
    let remoteTimeout;
    let lastReportedTime = 0;

    // Escudo temporal para evitar bucles
    function setRemoteAction(duration = 1500) {
      isRemoteAction = true;
      clearTimeout(remoteTimeout);
      remoteTimeout = setTimeout(() => {
        isRemoteAction = false;
      }, duration);
    }

    // --- GESTIÓN DE CONEXIÓN ROBUSTA (ANTI-FALLOS) ---
    const statusBadge = document.getElementById('status-badge');

    socket.on('connect', () => {
      statusBadge.className = 'status-badge status-connected';
      statusBadge.innerText = '🟢 Conectado';
      // AL RECONECTAR: volver a unirse siempre a la sala
      socket.emit('join-room', roomId);
    });

    socket.on('disconnect', () => {
      statusBadge.className = 'status-badge status-disconnected';
      statusBadge.innerText = '🔴 Desconectado';
    });

    socket.on('reconnecting', () => {
      statusBadge.className = 'status-badge status-reconnecting';
      statusBadge.innerText = '🟡 Reconectando...';
    });

    socket.on('room-users-count', (count) => {
      if (socket.connected) {
        statusBadge.innerText = `🟢 En línea (${count} en sala)`;
      }
    });

    // Cargar API de YouTube
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.body.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      // Si el socket ya estaba listo, pedir la sala
      if (socket.connected) socket.emit('join-room', roomId);
    }

    socket.on('sync-init', (data) => {
      if (!player) {
        player = new YT.Player('player', {
          videoId: data.videoId,
          playerVars: { 
            'autoplay': data.isPlaying ? 1 : 0, 
            'start': Math.floor(data.currentTime),
            'playsinline': 1 
          },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      } else {
        setRemoteAction(2000);
        player.loadVideoById(data.videoId, data.currentTime);
        if (!data.isPlaying) player.pauseVideo();
      }
      renderQueue(data.playlist || []);
    });

    // 🔄 Sincronización continua de fondo (Heartbeat cada 4 segs)
    socket.on('heartbeat-sync', (data) => {
      if (!player || !player.getCurrentTime || isRemoteAction) return;

      const localTime = player.getCurrentTime();
      const drift = Math.abs(localTime - data.currentTime);

      // Si nos hemos desviado más de 2.5 segundos, corregir la posición
      if (drift > 2.5 || data.force) {
        setRemoteAction(1200);
        player.seekTo(data.currentTime, true);
      }

      // Si el estado play/pause difiere de la sala
      const state = player.getPlayerState();
      if (data.isPlaying && state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
        setRemoteAction(1200);
        player.playVideo();
      } else if (!data.isPlaying && state === YT.PlayerState.PLAYING) {
        setRemoteAction(1200);
        player.pauseVideo();
      }
    });

    // Control de eventos locales
    function onPlayerStateChange(event) {
      if (isRemoteAction) return;
      const currentTime = player.getCurrentTime();

      if (event.data === YT.PlayerState.PLAYING) {
        socket.emit('play', currentTime);
      } else if (event.data === YT.PlayerState.PAUSED) {
        socket.emit('pause', currentTime);
      } else if (event.data === YT.PlayerState.ENDED) {
        socket.emit('video-ended');
      }
    }

    // Monitor para detectar saltos manuales en la barra de tiempo (Seek)
    setInterval(() => {
      if (!player || !player.getCurrentTime || isRemoteAction) return;
      const current = player.getCurrentTime();
      if (Math.abs(current - lastReportedTime) > 2.5 && player.getPlayerState() === YT.PlayerState.PLAYING) {
        socket.emit('seek', current);
      }
      lastReportedTime = current;
    }, 1000);

    // Si el usuario cambia de pestaña y regresa, pedir resincronización al instante
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && socket.connected) {
        socket.emit('request-sync');
      }
    });

    // Sockets recibidos
    socket.on('play', (time) => {
      setRemoteAction(1200);
      if (time && Math.abs(player.getCurrentTime() - time) > 1.5) player.seekTo(time, true);
      player.playVideo();
    });

    socket.on('pause', (time) => {
      setRemoteAction(1200);
      player.pauseVideo();
      if (time && Math.abs(player.getCurrentTime() - time) > 2) player.seekTo(time, true);
    });

    socket.on('seek', (time) => {
      setRemoteAction(1200);
      player.seekTo(time, true);
    });

    socket.on('video-changed', (videoId) => {
      setRemoteAction(2000);
      player.loadVideoById(videoId);
    });

    socket.on('queue-updated', (queue) => {
      renderQueue(queue);
    });

    socket.on('room-deleted', () => {
      alert('Esta sala ha sido eliminada por el administrador.');
      window.location.href = '/';
    });

    // Botón de forzar sincronización manual
    document.getElementById('sync-btn').addEventListener('click', () => {
      socket.emit('request-sync');
      const btn = document.getElementById('sync-btn');
      btn.innerText = '✅ ¡Sincronizado!';
      setTimeout(() => { btn.innerText = '🔄 Sincronizar'; }, 1500);
    });

    // Buscador
    document.getElementById('search-btn').addEventListener('click', performSearch);
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    function performSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      document.getElementById('search-results').innerHTML = '<div class="empty-state">Buscando vídeos...</div>';
      socket.emit('search-videos', q);
    }

    socket.on('search-results', (results) => {
      const container = document.getElementById('search-results');
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron resultados.</div>';
        return;
      }

      results.forEach((v) => {
        const div = document.createElement('div');
        div.className = 'video-card';
        div.innerHTML = `
          <img src="${v.thumbnail}" alt="">
          <div class="video-info">
            <div class="title" title="${v.title}">${v.title}</div>
            <div class="channel">${v.author} • ${v.duration}</div>
          </div>
          <div class="card-actions">
            <button onclick='playNow(${JSON.stringify(v)})'>▶ Ver</button>
            <button class="btn-secondary" onclick='addToQueue(${JSON.stringify(v)})'>+ Cola</button>
          </div>
        `;
        container.appendChild(div);
      });
    });

    function playNow(video) { socket.emit('change-video', video.videoId); }
    function addToQueue(video) { socket.emit('add-to-queue', video); }
    function removeQueueItem(index) { socket.emit('remove-from-queue', index); }

    function renderQueue(queue) {
      document.getElementById('queue-count').innerText = queue.length;
      const list = document.getElementById('queue-list');
      list.innerHTML = '';
      if (queue.length === 0) {
        list.innerHTML = '<div class="empty-state">La cola está vacía. Añade vídeos desde el buscador.</div>';
        return;
      }
      queue.forEach((v, index) => {
        const div = document.createElement('div');
        div.className = 'video-card';
        div.innerHTML = `
          <img src="${v.thumbnail}" alt="">
          <div class="video-info">
            <div class="title">${v.title}</div>
            <div class="channel">${v.author || ''}</div>
          </div>
          <div class="card-actions">
            <button class="btn-secondary" onclick="removeQueueItem(${index})">❌</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (tab === 'search') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-search').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-queue').classList.add('active');
      }
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      alert('¡Enlace de sala copiado!');
    });
  </script>
</body>
</html>
