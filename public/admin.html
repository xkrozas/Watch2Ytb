<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Watch2Gether - Panel de Administración</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2280%22 font-weight=%22bold%22 fill=%22%23e50914%22>W</text></svg>">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0f1216;
      --bg-panel: #161b22;
      --bg-header: #12161c;
      --accent-red: #e50914;
      --accent-red-hover: #b80710;
      --accent-blue: #2574a9;
      --text-main: #f1f5f9;
      --text-muted: #8c9ba5;
      --border-color: #242c37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 25px 15px; }
    .container { max-width: 1150px; margin: 0 auto; }

    /* Login Box */
    #login-screen {
      max-width: 380px; margin: 120px auto; background: var(--bg-panel); padding: 30px;
      border-radius: 8px; border: 1px solid var(--border-color); text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }
    #login-screen h2 { margin-bottom: 20px; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    input[type="password"] {
      width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--border-color);
      background: #0b0e13; color: white; margin-bottom: 15px; font-size: 14px; outline: none; text-align: center;
    }
    input[type="password"]:focus { border-color: var(--accent-red); }

    button {
      background: var(--accent-red); color: #fff; border: none; padding: 10px 16px;
      border-radius: 4px; cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.2s;
    }
    button:hover { background: var(--accent-red-hover); }

    /* Dashboard */
    #dashboard { display: none; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;
    }
    .brand-title { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .w2g-badge { background: var(--accent-red); color: #fff; font-size: 11px; padding: 3px 6px; border-radius: 4px; }

    /* Tarjetas de estadísticas */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card {
      background: var(--bg-panel); padding: 18px 20px; border-radius: 8px;
      border: 1px solid var(--border-color); border-left: 4px solid var(--accent-red);
    }
    .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .stat-card .num { font-size: 26px; font-weight: 800; margin-top: 6px; color: #fff; }

    /* Tabla de salas */
    .table-responsive { width: 100%; overflow-x: auto; background: var(--bg-panel); border-radius: 8px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    th { background: #12161c; color: var(--text-muted); text-transform: uppercase; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }

    .room-tag { font-weight: 700; color: #fff; background: #0b0e13; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); font-family: monospace; font-size: 12px; }
    .badge-users { background: #14281a; color: #4ade80; border: 1px solid #166534; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .badge-empty { background: #22272f; color: var(--text-muted); padding: 3px 8px; border-radius: 12px; font-size: 11px; }

    .user-pill { display: inline-block; font-size: 11px; background: #1f2733; padding: 2px 6px; border-radius: 4px; margin: 2px 2px 2px 0; }
    .user-pill.is-host { background: #3b1b22; color: #ff8088; border: 1px solid var(--accent-red); font-weight: 700; }

    .video-cell { max-width: 250px; }
    .video-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video-state { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .perm-badge { display: inline-block; font-size: 10px; padding: 2px 5px; border-radius: 3px; background: #1f2733; color: var(--text-muted); margin-top: 2px; }

    .btn-view { background: #1f2937; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 4px; color: #fff; font-weight: 600; font-size: 12px; margin-right: 6px; border: 1px solid var(--border-color); }
    .btn-view:hover { background: #374151; }
    .btn-delete { background: var(--accent-red); padding: 6px 10px; font-size: 12px; }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- PANTALLA DE ACCESO -->
    <div id="login-screen">
      <h2>🔒 Acceso Admin <span class="w2g-badge">Red Edition</span></h2>
      <input type="password" id="admin-pass" placeholder="Introduce la contraseña..." autofocus>
      <button onclick="attemptLogin()" style="width: 100%;">Entrar al panel</button>
      <p id="error-msg" style="color: #ff4d4d; font-size: 12px; margin-top: 10px; display: none;">Contraseña incorrecta</p>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="dashboard">
      <header>
        <div class="brand-title">
          <span>🛠️ Panel de Control de Salas</span>
          <span class="w2g-badge">Watch2Gether</span>
        </div>
        <button onclick="logoutAdmin()" style="background: #242c37; font-size: 12px;">Cerrar sesión</button>
      </header>

      <!-- Estadísticas -->
      <div class="stats-bar">
        <div class="stat-card">
          <div class="label">Salas Creadas</div>
          <div class="num" id="total-rooms">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Usuarios Conectados</div>
          <div class="num" id="total-users">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Salas en Reproducción</div>
          <div class="num" id="active-play-rooms">0</div>
        </div>
      </div>

      <!-- Tabla de Salas -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID de Sala</th>
              <th>Participantes</th>
              <th>Vídeo en Reproducción</th>
              <th>Permisos Activos</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="rooms-table-body">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
        <div id="no-rooms" class="empty-state" style="display: none;">No hay salas abiertas en este momento.</div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let savedPassword = sessionStorage.getItem('w2g_admin_pass') || '';

    // Si ya inició sesión anteriormente en la pestaña, entrar directo
    if (savedPassword) {
      socket.emit('admin-auth', savedPassword);
    }

    function attemptLogin() {
      const pass = document.getElementById('admin-pass').value;
      savedPassword = pass;
      socket.emit('admin-auth', pass);
    }

    document.getElementById('admin-pass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') attemptLogin();
    });

    socket.on('admin-auth-success', () => {
      sessionStorage.setItem('w2g_admin_pass', savedPassword);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
    });

    socket.on('admin-auth-fail', () => {
      sessionStorage.removeItem('w2g_admin_pass');
      document.getElementById('error-msg').style.display = 'block';
    });

    socket.on('admin-rooms-data', (rooms) => {
      updateDashboard(rooms);
    });

    function updateDashboard(rooms) {
      document.getElementById('total-rooms').innerText = rooms.length;
      const totalUsers = rooms.reduce((acc, r) => acc + r.usersCount, 0);
      document.getElementById('total-users').innerText = totalUsers;

      const playingRooms = rooms.filter(r => r.isPlaying).length;
      document.getElementById('active-play-rooms').innerText = playingRooms;

      const tbody = document.getElementById('rooms-table-body');
      tbody.innerHTML = '';

      if (rooms.length === 0) {
        document.getElementById('no-rooms').style.display = 'block';
        return;
      }
      document.getElementById('no-rooms').style.display = 'none';

      rooms.forEach((r) => {
        const tr = document.createElement('tr');
        const userBadgeClass = r.usersCount > 0 ? 'badge-users' : 'badge-empty';

        // Renderizado de lista de usuarios con corona para el anfitrión
        let usersHtml = '';
        if (r.users && r.users.length > 0) {
          usersHtml = r.users.map(u => 
            `<span class="user-pill ${u.isHost ? 'is-host' : ''}">${u.isHost ? '👑 ' : ''}${u.name}</span>`
          ).join('');
        } else {
          usersHtml = '<span style="color: var(--text-muted); font-size: 11px;">Sin usuarios</span>';
        }

        // Permisos de la sala
        const permControl = r.permissions.controlPlayer === 'host' ? '🔒 Controles: Host' : '👥 Controles: Todos';
        const permManage = r.permissions.manageVideos === 'host' ? '🔒 Vídeos: Host' : '👥 Vídeos: Todos';
        const permChat = r.permissions.chat === 'host' ? '🔒 Chat: Host' : '👥 Chat: Todos';

        tr.innerHTML = `
          <td>
            <span class="room-tag">${r.id}</span>
          </td>
          <td>
            <div style="margin-bottom: 5px;">
              <span class="${userBadgeClass}">👤 ${r.usersCount} usuario(s)</span>
            </div>
            <div>${usersHtml}</div>
          </td>
          <td class="video-cell">
            <div class="video-title" title="${r.videoTitle}">${r.videoTitle}</div>
            <div class="video-state">
              ${r.isPlaying ? '▶️ Reproduciendo' : '⏸️ En pausa'} • 
              <a href="https://youtube.com/watch?v=${r.videoId}" target="_blank" style="color: #60a5fa; text-decoration: none;">Ver en YT</a>
              • 📑 ${r.queueCount} en cola
            </div>
          </td>
          <td>
            <div><span class="perm-badge">${permControl}</span></div>
            <div><span class="perm-badge">${permManage}</span></div>
            <div><span class="perm-badge">${permChat}</span></div>
          </td>
          <td>
            <a href="/?r=${r.id}" target="_blank" class="btn-view">👁️ Entrar</a>
            <button class="btn-delete" onclick="deleteRoom('${r.id}')">🗑️ Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteRoom(roomId) {
      if (confirm(`¿Seguro que quieres eliminar la sala "${roomId}"? Se cerrará la sesión y se expulsará a todos los participantes.`)) {
        socket.emit('admin-delete-room', { password: savedPassword, roomId: roomId });
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('w2g_admin_pass');
      window.location.reload();
    }
  </script>
</body>
</html>
